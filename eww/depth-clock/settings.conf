# Settings for the Eww wallpaper depth clock.
# Sourced by eww/scripts/depthctl — plain shell variables, no daemon.
# Layout values are screen pixels; the clock appearance itself lives in
# eww/styles/_depth-clock.scss. See eww/depth-clock/README.md.

# Height of the depth window and of the transparent foreground band, measured
# from the top of the screen. Must cover the clock label's line box (380px font
# => 520px line box, plus 49px padding-top) so the foreground always sits over
# everything the clock draws. Keep in sync with eww/styles/_depth-clock.scss.
DEPTH_BAND_HEIGHT=580

# Pixels reserved at the very top by another shell (a bar), in screen pixels.
# Hyprland reports this itself (`hyprctl -j monitors` -> reserved), so the value
# below is only read on niri, which has no such query: Eww opens the clock with
# set_exclusive_zone(0) (:exclusive false), and niri positions such a surface
# inside the area left over by exclusive zones — so a top-anchored clock lands
# below the Noctalia bar and stops matching the wallpaper band. Set this to the
# bar height (bar + its top margin) to shift the window back to y=0. 0 = nothing
# reserves the top edge.
# Measured on LVDS-1 with the Noctalia bar ("framed", marginVertical 4): the
# probe window landed at y=35, so that is what the bar reserves.
DEPTH_TOP_RESERVED=35

# Wallpapers that have a foreground mask.
# Format: <file name>|<background colour>|<tolerance %>|<speck area px>
#
#   background colour  dominant flat colour behind the subject
#   tolerance          0-100, how far a pixel may differ and still count as
#                      background (5 keeps paper texture, drops the subject)
#   speck area         connected components smaller than this many pixels of
#                      the *original* wallpaper are dropped (paper dust and
#                      stray art dots); scaled to the output. 0 disables it.
DEPTH_MASKS=(
  "Nyx Bright.png|#F0EBD9|5|1000"
)
