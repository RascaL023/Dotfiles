# =========================================================================
# Yazi -- theme.toml (STATIC)
# =========================================================================

"$schema" = "https://yazi-rs.github.io/schemas/theme.json"

[flavor]
dark  = "matugen"
light = "matugen"


[mgr]
border_symbol = "┃"
syntect_theme = ""

[tabs]
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[status]
sep_left = { open = " ", close = " " }
sep_right = { open = " ", close = " " }
progress_label = { bold = true }

[which]
cols = 3
separator = "  "

[confirm]
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

[notify]
icon_info = ""
icon_warn = ""
icon_error = ""

[cmp]
icon_file = ""
icon_folder = ""
icon_command = ""
