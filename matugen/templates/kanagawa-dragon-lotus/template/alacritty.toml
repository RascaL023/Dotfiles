## Except for testing.


#########
##  UI ##
#########

[window]
opacity         = 0.9
padding.x       = 25
padding.y       = 20

[cursor.style]
shape           = "Beam"

[font]
size            = 10.9

[font.normal]
family          = "Maple Mono NF"
style           = "Regular"

[font.bold]
family          = "Maple Mono NF"
style           = "Bold"

[font.italic]
family          = "Maple Mono NF"
style           = "Italic"

[font.bold_italic]
family          = "Maple Mono NF"
style           = "Bold Italic"

[colors.vi_mode_cursor]
text            = "CellBackground"
cursor          = "CellForeground"


############
## Colors ##
############

[colors.primary]
background              = "{{ background }}"
foreground              = "{{ foreground }}"
bright_foreground       = "{{ cursor }}"

[colors.cursor]
text                    = "{{ accent.on_primary }}"
cursor                  = "{{ accent.primary }}"

[colors.selection]
text                    = "{{ accent.secondary }}"
background              = "{{ accent.on_secondary }}"

[colors.normal]
black                   = "{{ color0 }}"
red                     = "{{ color1 }}"
green                   = "{{ color2 }}"
yellow                  = "{{ color3 }}"
blue                    = "{{ color4 }}"
magenta                 = "{{ color5 }}"
cyan                    = "{{ color6 }}"
white                   = "{{ color7 }}"

[colors.bright]
black                   = "{{ color8 }}"
red                     = "{{ color9 }}"
green                   = "{{ color10 }}"
yellow                  = "{{ color11 }}"
blue                    = "{{ color12 }}"
magenta                 = "{{ color13 }}"
cyan                    = "{{ color14 }}"
white                   = "{{ color15 }}"
