############################
## Generated with Matugen ##
############################
## Manual edit is not recomended,
## Except for testing.

onboarding = false

[keys]
previous_workspace = "prefix+{"
next_workspace = "prefix+}"

[theme.custom]

# ─────────────────────────────────────────────
# Base surfaces
# ─────────────────────────────────────────────
panel_bg  = "{{ surface.base }}"
surface0 = "{{ surface.medium }}"
surface1 = "{{ surface.high }}"
surface_dim = "{{ surface.highest }}"

# ─────────────────────────────────────────────
# Borders / muted UI
# ─────────────────────────────────────────────
overlay0 = "{{ border.default | to_color | lighten: 30 | format: hex }}"
overlay1 = "{{ border.active }}"

# ─────────────────────────────────────────────
# Foreground
# ─────────────────────────────────────────────
text    = "{{ text.primary }}"
subtext0 = "{{ text.secondary }}"

# ─────────────────────────────────────────────
# Main interaction accent
# ─────────────────────────────────────────────
accent = "{{ accent.primary }}"

# ─────────────────────────────────────────────
# Semantic / special colors
# ─────────────────────────────────────────────
mauve  = "{{ accent.secondary }}"
green  = "{{ status.success }}"
yellow = "{{ status.warning }}"
red    = "{{ status.error }}"
blue   = "{{ status.warning_container }}"
teal   = "{{ syntax.type }}"
peach  = "{{ syntax.string }}"
