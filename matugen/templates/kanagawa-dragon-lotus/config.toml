[config]

[templates.nvim]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/nvim.lua"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/nvim/theme.lua"

[templates.css]
input_path = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/gtk3.css"
output_path = "~/.myenv/theme/generated/kanagawa-dragon-lotus/css/theme.css"
post_hook       = """
    dconf write /org/gnome/desktop/interface/gtk-theme "'Adwaita'"
    dconf write /org/gnome/desktop/interface/gtk-theme "'Kanagawa-Dark-Dragon'"
"""

[templates.scss]
input_path = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/source.scss"
output_path = "~/.myenv/theme/generated/kanagawa-dragon-lotus/scss/_theme.scss"

[templates.lazygit]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/lazygit.yml"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/lazygit/config.yml"

[templates.herdr]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/herdr.toml"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/herdr/config.toml"
post_hook       = "herdr server reload-config"

[templates.alacritty]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/alacritty.toml"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/alacritty/theme.toml"
post_hook       = "mkdir -p ~/.myenv/theme/current/alacritty"

[templates.kitty]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/kitty.conf"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/kitty/theme.conf"
post_hook       = "pkill -SIGUSR1 kitty"

[templates.rasi]
input_path      = "~/.dotfile/matugen/templates/kanagawa-dragon-lotus/template/source.rasi"
output_path     = "~/.myenv/theme/generated/kanagawa-dragon-lotus/rasi/theme.rasi"
