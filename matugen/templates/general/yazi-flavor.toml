############################
## Generated with Matugen ##
############################
# Manual edit is not recomended,
# Except for testing.

[mgr]
cwd             = { fg = "{{ colors.primary.default.hex }}", bold = true }
hovered         = { bg = "{{ colors.surface_container_high.default.hex }}" }
preview_hovered = { fg = "{{ colors.primary.default.hex }}", underline = true }
find_keyword    = { fg = "{{ colors.secondary.default.hex }}", bold = true, italic = true, underline = true }
find_position   = { fg = "{{ colors.outline.default.hex }}", bold = true, italic = true }
symlink_target  = { fg = "{{ colors.tertiary.default.hex }}", italic = true }

marker_copied   = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
marker_cut      = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
marker_marked   = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
marker_selected = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

count_copied    = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}" }
count_cut       = { fg = "{{ colors.on_error.default.hex }}", bg = "{{ colors.error.default.hex }}" }
count_selected  = { fg = "{{ colors.on_secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }

border_style    = { fg = "{{ colors.outline_variant.default.hex }}" }

[tabs]
active   = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container_low.default.hex }}" }

[mode]
normal_main = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
normal_alt  = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

select_main = { fg = "{{ colors.on_tertiary.default.hex }}", bg = "{{ colors.tertiary.default.hex }}", bold = true }
select_alt  = { fg = "{{ colors.tertiary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

unset_main  = { fg = "{{ colors.on_secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}", bold = true }
unset_alt   = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[status]
overall         = { fg = "{{ colors.on_surface_variant.default.hex }}", bg = "{{ colors.surface_container_lowest.default.hex }}" }

perm_sep        = { fg = "{{ colors.outline_variant.default.hex }}" }
perm_type       = { fg = "{{ colors.tertiary.default.hex }}" }
perm_read       = { fg = "{{ colors.secondary.default.hex }}" }
perm_write      = { fg = "{{ colors.error.default.hex }}" }
perm_exec       = { fg = "{{ colors.primary.default.hex }}" }

progress_normal = { fg = "{{ colors.primary.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }
progress_error  = { fg = "{{ colors.error.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[which]
mask            = { bg = "{{ colors.surface_container_lowest.default.hex }}" }
cand            = { fg = "{{ colors.primary.default.hex }}" }
rest            = { fg = "{{ colors.on_surface_variant.default.hex }}" }
desc            = { fg = "{{ colors.outline.default.hex }}" }
separator_style = { fg = "{{ colors.outline_variant.default.hex }}" }

[confirm]
border  = { fg = "{{ colors.outline_variant.default.hex }}" }
title   = { fg = "{{ colors.primary.default.hex }}", bold = true }
content = {}
list    = {}
btn_yes = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}" }
btn_no  = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container_high.default.hex }}" }

[spot]
border   = { fg = "{{ colors.outline_variant.default.hex }}" }
title    = { fg = "{{ colors.primary.default.hex }}", bold = true }
tbl_col  = { fg = "{{ colors.tertiary.default.hex }}" }
tbl_cell = { fg = "{{ colors.on_surface.default.hex }}", reversed = true }

[notify]
title_info  = { fg = "{{ colors.tertiary.default.hex }}" }
title_warn  = { fg = "{{ colors.secondary.default.hex }}" }
title_error = { fg = "{{ colors.error.default.hex }}" }

[pick]
border   = { fg = "{{ colors.outline_variant.default.hex }}" }
active   = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = {}

[input]
border   = { fg = "{{ colors.outline_variant.default.hex }}" }
title    = { fg = "{{ colors.primary.default.hex }}" }
value    = { fg = "{{ colors.on_surface.default.hex }}" }
selected = { reversed = true }

[cmp]
border   = { fg = "{{ colors.outline_variant.default.hex }}" }
active   = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
inactive = {}

[tasks]
border  = { fg = "{{ colors.outline_variant.default.hex }}" }
title   = { fg = "{{ colors.primary.default.hex }}" }
hovered = { fg = "{{ colors.tertiary.default.hex }}", bold = true }

[help]
on      = { fg = "{{ colors.primary.default.hex }}" }
run     = { fg = "{{ colors.tertiary.default.hex }}" }
desc    = { fg = "{{ colors.on_surface_variant.default.hex }}" }
hovered = { fg = "{{ colors.on_primary.default.hex }}", bg = "{{ colors.primary.default.hex }}", bold = true }
footer  = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.surface_container_highest.default.hex }}" }

[filetype]
rules = [
	{ mime = "image/*", fg = "{{ colors.tertiary.default.hex }}" },
	{ mime = "{audio,video}/*", fg = "{{ colors.secondary.default.hex }}" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{ colors.outline.default.hex }}" },
	{ mime = "application/{pdf,doc,rtf}", fg = "{{ colors.on_surface_variant.default.hex }}" },
	{ mime = "vfs/{absent,stale}", fg = "{{ colors.outline.default.hex }}" },
	{ name = "*", is = "orphan", bg = "{{ colors.error.default.hex }}" },
	{ name = "*", is = "exec", fg = "{{ colors.primary.default.hex }}" },
	{ name = "*", is = "dummy", bg = "{{ colors.error.default.hex }}" },
	{ name = "*/", is = "dummy", bg = "{{ colors.error.default.hex }}" },
	{ name = "*/", fg = "{{ colors.primary.default.hex }}" },
]
