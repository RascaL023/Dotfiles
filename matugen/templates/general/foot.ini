[main]
font=MapleMono NF:size=11
pad=25x20

[colors]
foreground={{ colors.on_surface.default.hex_stripped }}
background={{ colors.surface.default.hex_stripped }}

# base16-style 0-7 (dark) — palette diindeks via color0..color5
regular0={{ colors.surface.default.hex_stripped }}
regular1={{ colors.error.default.hex_stripped }}
regular2={{ colors.tertiary.default.hex_stripped }}
regular3={{ colors.secondary.default.hex_stripped }}
regular4={{ colors.primary.default.hex_stripped }}
regular5={{ colors.tertiary_fixed_dim.default.hex_stripped }}
regular6={{ colors.secondary_fixed_dim.default.hex_stripped }}
regular7={{ colors.on_surface.default.hex_stripped }}

# right 8-15
bright0={{ colors.surface_variant.default.hex_stripped }}
bright1={{ colors.error_container.default.hex_stripped | blend: {{ colors.primary.default.hex_stripped }}, 0.6 | lighten: 40.0 }}
bright2={{ colors.tertiary_container.default.hex_stripped }}
bright3={{ colors.secondary_container.default.hex_stripped }}
bright4={{ colors.primary_container.default.hex_stripped }}
bright5={{ colors.tertiary_fixed.default.hex_stripped }}
bright6={{ colors.secondary_fixed.default.hex_stripped }}
bright7={{ colors.on_surface.default.hex_stripped }}
