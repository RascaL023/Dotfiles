# One feel profile -> one file per consumer. output_path is relative to the
# root passed with `-p`; profiles differ only in blueprint/<profile>.json, so a
# new consumer is one block here. Block names are labels, not file names.
[config]

# Font variables for eww, imported by eww/eww.scss.
[templates.scss]
input_path  = "~/.config/matugen/templates/feel/template/source.scss"
output_path = "/scss/_feel.scss"

# Terminal fonts, read by kitty and foot through `include`.
[templates.kitty]
input_path  = "~/.config/matugen/templates/feel/template/kitty.conf"
output_path = "/kitty/font.conf"

[templates.foot]
input_path  = "~/.config/matugen/templates/feel/template/foot.ini"
output_path = "/foot/font.ini"

# Shell fonts: waybar is GTK 3, swaync is GTK 4, hence two files.
[templates.waybar]
input_path  = "~/.config/matugen/templates/feel/template/gtk3.css"
output_path = "/css/waybar-font.css"

[templates.swaync]
input_path  = "~/.config/matugen/templates/feel/template/gtk4.css"
output_path = "/css/swaync-font.css"
