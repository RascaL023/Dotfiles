############################
## Generated with Matugen ##
############################
## Manual edit is not recomended,
## Except for testing.


#########
##  UI ##
#########

[window]
opacity         = 0.9
padding.x       = 25
padding.y       = 20

[cursor.style]
shape           = "Beam"

[font]
size            = 10.9

[font.normal]
family          = "Maple Mono NF"
style           = "Regular"

[font.bold]
family          = "Maple Mono NF"
style           = "Bold"

[font.italic]
family          = "Maple Mono NF"
style           = "Italic"

[font.bold_italic]
family          = "Maple Mono NF"
style           = "Bold Italic"

[colors.vi_mode_cursor]
text            = "CellBackground"
cursor          = "CellForeground"


############
## Colors ##
############

[colors.primary]
background              = "{{ colors.surface.default.hex }}"
foreground              = "{{ colors.on_surface.default.hex }}"
bright_foreground       = "{{ colors.on_surface.default.hex }}"

[colors.cursor]
text                    = "{{ colors.on_primary.default.hex }}"
cursor                  = "{{ colors.primary.default.hex }}"

[colors.selection]
text                    = "{{ colors.on_secondary_container.default.hex }}"
background              = "{{ colors.secondary_container.default.hex }}"

[colors.normal]
black                   = "{{ colors.surface.default.hex }}"
red                     = "{{ colors.error.default.hex }}"
green                   = "{{ colors.tertiary.default.hex }}"
yellow                  = "{{ colors.secondary.default.hex }}"
blue                    = "{{ colors.primary.default.hex }}"
magenta                 = "{{ colors.tertiary_fixed_dim.default.hex }}"
cyan                    = "{{ colors.secondary_fixed_dim.default.hex }}"
white                   = "{{ colors.on_surface.default.hex }}"

[colors.bright]
black                   = "{{ colors.surface_variant.default.hex }}"
red                     = "{{ colors.error_container.default.hex | blend: {{ colors.primary.default.hex }}, 0.6 | set_lightness: 80.0 }}"
green                   = "{{ colors.tertiary_container.default.hex }}"
yellow                  = "{{ colors.secondary_container.default.hex }}"
blue                    = "{{ colors.primary_container.default.hex }}"
magenta                 = "{{ colors.tertiary_fixed.default.hex }}"
cyan                    = "{{ colors.secondary_fixed.default.hex }}"
white                   = "{{ colors.on_surface.default.hex }}"

[colors.search.matches]
foreground              = "{{ colors.on_secondary_container.default.hex }}"
background              = "{{ colors.secondary_container.default.hex }}"

[colors.search.focused_match]
foreground              = "{{ colors.on_primary.default.hex }}"
background              = "{{ colors.primary.default.hex }}"

[colors.footer_bar]
background              = "{{ colors.surface_container.default.hex }}"
foreground              = "{{ colors.on_surface.default.hex }}"

[colors.hints.start]
foreground              = "{{ colors.on_secondary_container.default.hex }}"
background              = "{{ colors.secondary.default.hex }}"

[colors.hints.end]
foreground              = "{{ colors.secondary.default.hex }}"
background              = "{{ colors.surface.default.hex }}"
