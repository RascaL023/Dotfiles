[config]

[templates.scss]
input_path  = "~/.config/matugen/core/feel/template/source.scss"
output_path = "/scss/_feel.scss"

[templates.kitty]
input_path  = "~/.config/matugen/core/feel/template/kitty.conf"
output_path = "/kitty/feel.conf"

[templates.foot]
input_path  = "~/.config/matugen/core/feel/template/foot.ini"
output_path = "/foot/font.ini"

[templates.waybar]
input_path  = "~/.config/matugen/core/feel/template/gtk3.css"
output_path = "/css/waybar-font.css"

[templates.swaync]
input_path  = "~/.config/matugen/core/feel/template/gtk4.css"
output_path = "/css/swaync-font.css"

[templates.alacritty]
input_path  = "~/.config/matugen/core/feel/template/alacritty.toml"
output_path = "/alacritty/feel.toml"
