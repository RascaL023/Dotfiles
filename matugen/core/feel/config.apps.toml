[templates.swaync]
input_path  = "~/.config/matugen/core/feel/template/apps/gtk4.css"
output_path = "/css/swaync-font.css"

[templates.alacritty]
input_path  = "~/.config/matugen/core/feel/template/apps/alacritty.toml"
output_path = "/alacritty/feel.toml"

[templates.rofi]
input_path  = "~/.config/matugen/core/feel/template/apps/rofi.rasi"
output_path = "/rasi/feel.rasi"
