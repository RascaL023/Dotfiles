[notification]
border = false
collapse_on_dismiss = false
filter_order = []

[osd]
hide_delay_ms = 1500
position = "top_left"
position_vertical = "bottom_left"

[shell]
avatar_path = "/home/rascal/Pictures/Mine/Me-circled.png"
button_borders = false
card_borders = false
font_family = "Cantarell"
input_borders = false

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_session = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true
    size = 40

    [shell.screenshot]
    confirm_region = true
    directory = "/home/rascal/Pictures/Screenshots"

    [shell.session]
    show_shortcuts = false

    [shell.shadow]
    alpha = 0.30999999307096004

    [shell.window_switcher]
    show_app_icon = false
    show_caption = false
    show_count = false

[system.monitor]
cpu_poll_seconds = 7
disk_poll_seconds = 20
gpu_poll_seconds = 7
memory_poll_seconds = 7
network_poll_seconds = 10

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Dragon"
custom_palette = "nyx-bright-sft"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-monochrome"

[wallpaper]
directory = "/home/rascal/Pictures/Wallpaper"
transition = [ "disc", "honeycomb", "stripes", "wipe" ]
transition_on_startup = true

    [wallpaper.default]
    path = "/home/rascal/Pictures/Wallpaper/Balloon Roof.jpg"

    [wallpaper.last]
    path = "/home/rascal/Pictures/Wallpaper/Balloon Roof.jpg"

