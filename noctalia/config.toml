[audio]
enable_sounds = false

[bar.default]
color = "primary"
end = [ "audio_visualizer", "spacer_3", "group:g1", "group:g4", "group:g3", "group:g2" ]
font_scale = 0.9499999862164259
font_weight = 380
icon_color = "secondary"
margin_ends = 90
panel_overlap = 0
start = [ "launcher", "workspaces", "spacer_2", "media" ]
thickness = 35

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "start"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "control-center", "notifications" ]
    opacity = 1.0
    padding = 6.0
    radius = 10.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "settings", "caffeine", "screenshot", "wallpaper", "clipboard" ]
    opacity = 1.0
    padding = 6.0
    widget_spacing = 9

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "battery", "network" ]
    opacity = 1.0
    padding = 6.0

[battery]
